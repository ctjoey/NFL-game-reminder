# Guards the regional-coverage feed - the file that tells each market which CBS/FOX game it
# actually receives. Everything in that feed is reported to users as confirmed, so a wrong entry
# is worse than a missing one, and it is checked on every push rather than trusted.
#
# The Thursday run is the nag: coverage maps publish midweek, and a week with ambiguous windows
# and no map is exactly the state that produced the bug this pipeline exists to prevent.
name: Coverage feed

on:
  push:
    paths:
      - 'server/**'
      - 'test/**'
      - 'marketing/**'
      - 'docs/coverage-*.json'
      - 'ios/NFLGameReminder/Resources/coverage-*.json'
      - '.github/workflows/coverage.yml'
  schedule:
    - cron: '0 15 * * 4'   # Thursdays, 15:00 UTC - after the midweek maps are out
  workflow_dispatch:

jobs:
  feed:
    name: Validate and publish checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Feed validates against the schedule
        run: node server/coverage/feed-cli.js validate

      - name: Feed published to the site matches the copy bundled in the app
        # The bundled copy is the floor the app uses before its first successful fetch. If the two
        # drift, a fresh install shows different coverage from an updated one, which is the kind of
        # bug nobody reproduces.
        run: |
          if ! diff -u docs/coverage-2026.json ios/NFLGameReminder/Resources/coverage-2026.json; then
            echo "::error::docs/coverage-2026.json and the bundled copy differ. Run: cp docs/coverage-2026.json ios/NFLGameReminder/Resources/coverage-2026.json"
            exit 1
          fi

      - name: Pull the live schedule
        # The checked-in seed is a placeholder: one CBS and one FOX game per Sunday window, so
        # every window resolves by the "only candidate" rule and any check run against it reports
        # no ambiguity for weeks that are nothing but ambiguity. The runner has network; the seed
        # is only a fallback for reading, never for deciding.
        id: live
        continue-on-error: true
        run: node server/coverage/feed-cli.js fetch --out /tmp/games.json

      - name: Coverage status by week
        run: |
          if [ -s /tmp/games.json ]; then
            node server/coverage/feed-cli.js status --games /tmp/games.json
          else
            echo "::warning::live schedule unavailable; status below is against the seed and understates how much is open"
            node server/coverage/feed-cli.js status
          fi

      - name: The published URL actually serves the feed
        # The app fetches this exact URL. Pages serves the default branch, so a feature branch can
        # legitimately be ahead of what is live - that is reported, not failed. On the default
        # branch a 404 means the remote refresh path is dead and every phone is stuck on the
        # bundled floor, which is a real failure.
        env:
          URL: https://ctjoey.github.io/NFL-game-reminder/coverage-2026.json
        run: |
          set -o pipefail
          code=000
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/live.json -w '%{http_code}' "$URL" || echo 000)
            [ "$code" = "200" ] && break
            echo "attempt $attempt: HTTP $code, retrying in 20s"
            sleep 20
          done
          echo "final: HTTP $code from $URL"
          if [ "$code" = "200" ]; then
            node -e '
              const f = JSON.parse(require("fs").readFileSync("/tmp/live.json", "utf8"));
              if (f.version !== 1) { console.error("::error::live feed version is " + f.version + ", the app only reads 1"); process.exit(1); }
              const weeks = Object.keys(f.weeks || {});
              console.log("live feed: season " + f.season + ", weeks [" + weeks.join(", ") + "], generated " + f.generatedAt);
            '
          elif [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::$URL returned $code on the default branch. The app cannot refresh its coverage map."
            exit 1
          else
            echo "::warning::$URL returned $code. Expected on a branch Pages has not published yet; must be 200 once merged."
          fi

      - name: Candidate games per regional window
        # Printed before the nag below, so a run that fails for a missing map still shows exactly
        # which games the map needs to be read for.
        #
        # Guarded in shell rather than with `if: hashFiles(...)`: hashFiles only resolves paths
        # inside the workspace, so against /tmp it returns empty and silently skips the step.
        run: |
          if [ -s /tmp/games.json ]; then
            node server/coverage/feed-cli.js candidates --games /tmp/games.json
          else
            echo "::warning::live schedule unavailable; candidate list would only describe the seed"
          fi

      - name: A map is published for the week now in play
        # Only nags on the schedule, or on demand. A push mid-week should not fail for a map that
        # is not out yet.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -s /tmp/games.json ]; then
            echo "::error::Could not pull the live schedule, so the weekly map check did not run. This is not a pass - re-run once the source is reachable."
            exit 1
          fi
          node server/coverage/feed-cli.js check --games /tmp/games.json
