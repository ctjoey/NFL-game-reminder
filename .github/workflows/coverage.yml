# Guards the regional-coverage feed - the file that tells each market which CBS/FOX game it
# actually receives. Everything in that feed is reported to users as confirmed, so a wrong entry
# is worse than a missing one, and it is checked on every push rather than trusted.
#
# The Thursday run is the nag: coverage maps publish midweek, and a week with ambiguous windows
# and no map is exactly the state that produced the bug this pipeline exists to prevent.
name: Coverage feed

on:
  push:
    paths:
      - 'server/**'
      - 'test/**'
      - 'marketing/**'
      - 'docs/coverage-*.json'
      - 'ios/NFLGameReminder/Resources/coverage-*.json'
      - '.github/workflows/coverage.yml'
  schedule:
    # Wednesday 4pm Eastern. GitHub cron is UTC and has never heard of daylight saving, so both
    # are listed: 20:00 is 4pm EDT, 21:00 is 4pm EST. One of the two is an hour off for half the
    # season and runs a second, harmless check.
    #
    # The rest are catch-up. GitHub's scheduler is best effort and can be very late - week 6's
    # 5pm asks were not delivered until 7:32pm. Waiting politely for one firing means a week where
    # nobody gets the maps, so the ask is repeated hourly into the small hours. That is safe to do
    # because the job is idempotent: the first run to find published maps writes them, and every
    # run after that sees the week already has entries and exits without touching anything.
    - cron: '0 20 * * 3'
    - cron: '0 21 * * 3'
    - cron: '0 22 * * 3'
    - cron: '0 23 * * 3'
    - cron: '0 0 * * 4'
    - cron: '0 1 * * 4'
    - cron: '0 2 * * 4'
    - cron: '0 3 * * 4'
    - cron: '0 11 * * 4'
    - cron: '0 15 * * 4'   # Thursdays - the nag, if we still have not published by then
  workflow_dispatch:
    inputs:
      probe_week:
        description: 'Probe 506 for this week and print the page structure (blank to skip)'
        type: string
        default: ''
      reread:
        description: 'Read the maps again even if this week was already read from them'
        type: boolean
        default: false
      test_notice:
        description: 'Post the "week published" notice for the current week, to check it arrives'
        type: boolean
        default: false

jobs:
  # Its own job so its output stands alone: the point of a probe is to be read, and buried under
  # sixty passing tests it is not. Read-only, manual, and it cannot fail the rest of the workflow.
  probe:
    name: Probe the published map page
    if: inputs.probe_week != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node server/coverage/sampler-cli.js probe --week "${{ inputs.probe_week }}"

  # Wednesday's job is to notice, not to complain: it says whether 506 has drawn the week's maps
  # yet. The Thursday nag below is the escalation if they are up and we still have not published.
  watch:
    name: Have the maps been posted?
    # Also on demand. Not being able to run the weekly job by hand meant the only way to test it
    # was to wait for Wednesday, which is a poor way to find out it does not work.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule != '0 15 * * 4')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Which week is in play
        id: wk
        run: |
          if [ -n "${{ inputs.probe_week }}" ]; then
            echo "week=${{ inputs.probe_week }}" >> "$GITHUB_OUTPUT"
            node server/coverage/feed-cli.js fetch --out /tmp/games.json || true
            exit 0
          fi
          node server/coverage/feed-cli.js fetch --out /tmp/games.json || true
          if [ -s /tmp/games.json ]; then
            echo "week=$(node server/coverage/feed-cli.js week --games /tmp/games.json)" >> "$GITHUB_OUTPUT"
          else
            echo "week=$(node server/coverage/feed-cli.js week)" >> "$GITHUB_OUTPUT"
          fi
      - name: Check 506
        id: check
        run: node server/coverage/sampler-cli.js watch --week "${{ steps.wk.outputs.week }}"

      # Read the maps and commit the result. Three things make this safe to leave unattended:
      #
      #   Nothing is written unless the reading verifies. `ingest` checks every game's own market
      #   against the map it read and refuses to emit if any disagree, so a projection aimed at the
      #   wrong place publishes nothing rather than publishing nonsense.
      #
      #   A hand-read week is never overwritten by an automatic run. A week the sampler itself
      #   read is re-read only when 506 has posted different map files than it was read from.
      #
      #   `apply` re-validates the whole feed against the live schedule before writing, and the
      #   commit carries only the two coverage files.
      - name: Read the maps and publish
        id: ingest
        run: |
          set -o pipefail
          # Whether to read at all is the sampler's call, not this file's: the answer depends on
          # which map files are up right now, and only it has them. It leaves hand-read weeks
          # alone, skips a week already read from these same maps, and reads again when 506 has
          # revised them - which it did to all three of week 4's within six hours.
          node server/coverage/sampler-cli.js ingest --save \
            ${{ inputs.reread && '--force' || '' }} \
            --week "${{ steps.wk.outputs.week }}" --games /tmp/games.json > /tmp/draft.json
          if [ "$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("/tmp/draft.json","utf8")).slots.length))')" = "0" ]; then
            echo "Nothing to write - see the sampler's reason above."
            exit 0
          fi
          node server/coverage/feed-cli.js apply --week "${{ steps.wk.outputs.week }}" \
            --file /tmp/draft.json --games /tmp/games.json \
            --source "506sports week ${{ steps.wk.outputs.week }}, sampled automatically"
          cp docs/coverage-2026.json ios/NFLGameReminder/Resources/coverage-2026.json
          node server/coverage/feed-cli.js validate --games /tmp/games.json
          echo "changed=1" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not start another workflow run, so this cannot loop.
      - name: Commit
        if: steps.ingest.outputs.changed == '1'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/coverage-2026.json ios/NFLGameReminder/Resources/coverage-2026.json
          # Only if there is one. A run that reused a saved calibration writes no new file, and
          # losing a week's coverage to a missing file that was never going to change is the
          # wrong trade - this step already failed that way once, after a clean read.
          if [ -f server/coverage/map-calibration.json ]; then
            git add server/coverage/map-calibration.json
          fi
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Week ${{ steps.wk.outputs.week }} coverage, read from the published maps

          Sampled from 506's maps and verified against the home-market rule: every
          game's own market reads as that game, or nothing would have been written.
          Markets the sampler was unsure about are absent, which leaves them as
          estimates in the app rather than confident mistakes."
          git push

      # A run that published says so. The commit alone was silent, so the only way to know the
      # week was in was to go and look. An issue notifies the repo owner by email and in the
      # GitHub app. If it cannot be posted the step fails, which notifies the same way.
      - name: Tell the owner the week is published
        if: steps.ingest.outputs.changed == '1' || inputs.test_notice
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.wk.outputs.week }}
          TEST: ${{ inputs.test_notice && '1' || '' }}
        run: |
          node -e '
            const f = JSON.parse(require("fs").readFileSync("docs/coverage-2026.json", "utf8"));
            const wk = process.env.WEEK, w = f.weeks[wk];
            if (!w) { console.error("::error::week " + wk + " is not in the feed"); process.exit(1); }
            const m = w.markets;
            const entries = Object.values(m).reduce((n, nets) => n + Object.values(nets).reduce((k, win) => k + Object.keys(win).length, 0), 0);
            const game = id => id === "none" ? "no game" : id.replace(/^\d{4}-W\d+-/, "").replace("-", " at ");
            const lines = [];
            for (const [mk, label] of [["hartford", "Hartford-New Haven"], ["newyork", "New York"]]) {
              const nets = m[mk]; if (!nets) continue;
              lines.push("", "**" + label + "**");
              for (const net of ["CBS", "FOX"]) for (const win of ["SUN_EARLY", "SUN_LATE"])
                if (nets[net]?.[win]) lines.push("- " + net + " " + (win === "SUN_EARLY" ? "1pm" : "4pm") + ": " + game(nets[net][win]));
            }
            const body = [
              (process.env.TEST ? "_Test of the notice - nothing new was published by this run._\n\n" : "") +
              "@" + process.env.GITHUB_REPOSITORY_OWNER + " week " + wk + " TV coverage is live: **" + entries + " entries across " + Object.keys(m).length + " markets**, read from " + (w.maps || []).join(", ") + ".",
              "", "The app picks it up on its next refresh (within 6 hours, or straight away on a fresh launch).",
              "", ...lines,
              "", "Run: " + process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID,
            ].join("\n");
            require("fs").writeFileSync("/tmp/notice.md", body);
          '
          title="Week ${WEEK} TV coverage published${TEST:+ (test)}"
          if ! gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/notice.md; then
            echo "::error::Week ${WEEK} published, but the notice could not be posted (are Issues turned on for this repo?)."
            exit 1
          fi

      # If the maps are up and nothing was written, somebody needs to look. Only then: a run that
      # published cleanly should be silent, and a Wednesday with no maps yet is not news.
      - name: Say so if the maps are up and unread
        if: steps.ingest.outputs.changed != '1'
        run: node server/coverage/sampler-cli.js watch --week "${{ steps.wk.outputs.week }}" --alert

  feed:
    name: Validate and publish checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Pull the live schedule
        # The checked-in seed is a placeholder: one CBS and one FOX game per Sunday window, so
        # every window resolves by the "only candidate" rule and any check run against it reports
        # no ambiguity for weeks that are nothing but ambiguity. The runner has network; the seed
        # is only a fallback for reading, never for deciding.
        id: live
        continue-on-error: true
        run: node server/coverage/feed-cli.js fetch --out /tmp/games.json

      - name: Feed validates against the schedule
        # Against the LIVE schedule. Validating against the seed was worse than not validating:
        # the seed's week 2 has different games in different windows, so a correct map is rejected
        # and a wrong game id is never caught. The feed describes the real season; it has to be
        # checked against the real season.
        run: |
          if [ -s /tmp/games.json ]; then
            node server/coverage/feed-cli.js validate --games /tmp/games.json
          else
            echo "::warning::live schedule unavailable; validating against the seed, which only proves the file is well-formed"
            node server/coverage/feed-cli.js validate
          fi

      - name: Feed published to the site matches the copy bundled in the app
        # The bundled copy is the floor the app uses before its first successful fetch. If the two
        # drift, a fresh install shows different coverage from an updated one, which is the kind of
        # bug nobody reproduces.
        run: |
          if ! diff -u docs/coverage-2026.json ios/NFLGameReminder/Resources/coverage-2026.json; then
            echo "::error::docs/coverage-2026.json and the bundled copy differ. Run: cp docs/coverage-2026.json ios/NFLGameReminder/Resources/coverage-2026.json"
            exit 1
          fi

      - name: Coverage status by week
        run: |
          if [ -s /tmp/games.json ]; then
            node server/coverage/feed-cli.js status --games /tmp/games.json
          else
            echo "::warning::live schedule unavailable; status below is against the seed and understates how much is open"
            node server/coverage/feed-cli.js status
          fi

      - name: The published URL actually serves the feed
        # The app fetches this exact URL. Pages serves the default branch, so a feature branch can
        # legitimately be ahead of what is live - that is reported, not failed. On the default
        # branch a 404 means the remote refresh path is dead and every phone is stuck on the
        # bundled floor, which is a real failure.
        env:
          URL: https://ctjoey.github.io/NFL-game-reminder/coverage-2026.json
        run: |
          set -o pipefail
          code=000
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/live.json -w '%{http_code}' "$URL" || echo 000)
            [ "$code" = "200" ] && break
            echo "attempt $attempt: HTTP $code, retrying in 20s"
            sleep 20
          done
          echo "final: HTTP $code from $URL"
          if [ "$code" = "200" ]; then
            node -e '
              const f = JSON.parse(require("fs").readFileSync("/tmp/live.json", "utf8"));
              if (f.version !== 1) { console.error("::error::live feed version is " + f.version + ", the app only reads 1"); process.exit(1); }
              const weeks = Object.keys(f.weeks || {});
              console.log("live feed: season " + f.season + ", weeks [" + weeks.join(", ") + "], generated " + f.generatedAt);
            '
          elif [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::$URL returned $code on the default branch. The app cannot refresh its coverage map."
            exit 1
          else
            echo "::warning::$URL returned $code. Expected on a branch Pages has not published yet; must be 200 once merged."
          fi

      - name: Candidate games per regional window
        # Printed before the nag below, so a run that fails for a missing map still shows exactly
        # which games the map needs to be read for.
        #
        # Guarded in shell rather than with `if: hashFiles(...)`: hashFiles only resolves paths
        # inside the workspace, so against /tmp it returns empty and silently skips the step.
        run: |
          if [ -s /tmp/games.json ]; then
            node server/coverage/feed-cli.js candidates --games /tmp/games.json
          else
            echo "::warning::live schedule unavailable; candidate list would only describe the seed"
          fi

      # Only the Thursday run nags. On Wednesday the maps may legitimately not be drawn yet, and a
      # check that cries wolf on a schedule is a check people learn to ignore.
      - name: A map is published for the week now in play
        # On demand, or on the Thursday cron only. A push mid-week should not fail for a map that
        # is not out yet, and neither should Wednesday's watch run - the maps are often not drawn
        # until Wednesday evening, and a check that cries wolf is a check people learn to ignore.
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && github.event.schedule == '0 15 * * 4')
        run: |
          if [ ! -s /tmp/games.json ]; then
            echo "::error::Could not pull the live schedule, so the weekly map check did not run. This is not a pass - re-run once the source is reachable."
            exit 1
          fi
          node server/coverage/feed-cli.js check --games /tmp/games.json
