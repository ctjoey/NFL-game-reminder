# XcodeGen spec. On a Mac:  brew install xcodegen && cd ios && xcodegen generate && open NFLGameReminder.xcodeproj
name: NFLGameReminder
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  NFLGameReminder:
    type: application
    platform: iOS
    sources:
      - path: NFLGameReminder
    resources:
      - path: NFLGameReminder/Resources
      - path: NFLGameReminder/Assets.xcassets
      - path: NFLGameReminder/PrivacyInfo.xcprivacy
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: NFLGameReminder/Info.plist
      properties:
        CFBundleDisplayName: Game Time
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.yourcompany.NFLGameReminder.refresh]
        NSCalendarsFullAccessUsageDescription: Add the games you follow to your calendar with coverage and kickoff times and your channel.
        NSUserNotificationsUsageDescription: Coverage-start, kickoff and schedule-change reminders for the games you follow.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: NFLGameReminderWidget
  NFLGameReminderWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NFLGameReminderWidget
      - path: NFLGameReminder/Models
      - path: NFLGameReminder/Services
    resources:
      - path: NFLGameReminder/Resources
      - path: NFLGameReminder/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.NFLGameReminder.Widget
    info:
      path: NFLGameReminderWidget/Info.plist
      properties:
        CFBundleDisplayName: Next Game
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  NFLGameReminderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NFLGameReminderTests
    dependencies:
      - target: NFLGameReminder
schemes:
  NFLGameReminder:
    build:
      targets:
        NFLGameReminder: all
    run:
      config: Debug
    test:
      targets: [NFLGameReminderTests]
    profile:
      config: Release
    archive:
      config: Release
